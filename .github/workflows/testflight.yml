name: TestFlight Release

# Every push to main archives Serene Driving and uploads it to TestFlight.
# Repo secrets required (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              — App Store Connect API Key ID
#   ASC_ISSUER_ID           — App Store Connect API Issuer ID
#   ASC_KEY_P8              — contents of AuthKey_<id>.p8
#   IOS_DEV_CERT_P12        — base64 of the CI development certificate
#   IOS_DEV_CERT_PASSWORD   — password for that .p12
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # App Store Connect refuse un binaire construit avec une bêta :
        # « Unsupported SDK or Xcode version [...] you need to use the latest Release
        # Candidates (RC) ». L'image xcode-27 ne contient QU'UNE bêta (27A5252f),
        # exposée sous quatre noms — Xcode.app, Xcode_27.0.app, Xcode_27.0.0.app,
        # Xcode_27_beta_6.app — donc choisir « celui dont le nom ne dit pas beta »
        # retombe sur le même binaire. D'où l'inventaire par identifiant de build
        # ci-dessous, et non par nom de dossier : un alias ne trompe pas un build id.
        run: |
          set -euo pipefail
          echo "Xcode installés (chemin → build) :"
          for x in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            b=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$x/Contents/version.plist" 2>/dev/null || echo '?')
            echo "  $x → $b"
          done
          # Les identifiants de build des bêtas installées, pour écarter aussi leurs alias.
          betas=$(for x in $(ls -d /Applications/Xcode*beta*.app 2>/dev/null); do
                    /usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$x/Contents/version.plist" 2>/dev/null || true
                  done | sort -u)
          chosen=""
          for x in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            b=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$x/Contents/version.plist" 2>/dev/null || echo '?')
            if [ -n "$betas" ] && echo "$betas" | grep -qx "$b"; then continue; fi
            chosen="$x"
          done
          if [ -z "$chosen" ]; then
            echo "::error::Cette image ne contient que des Xcode bêta — App Store Connect refusera l'upload."
            exit 1
          fi
          echo "Retenu : $chosen"
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # A stray newline in either identifier makes Apple answer 401 on
          # listTeams, which surfaces as an unhelpful "Communication with Apple
          # failed". Strip whitespace and check the shapes before we build.
          KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')
          echo "key id: ${#KEY_ID} chars (expect 10), issuer: ${#ISSUER_ID} chars (expect 36)"
          [ ${#KEY_ID} -eq 10 ] || { echo "::error::ASC_KEY_ID is ${#KEY_ID} chars, expected 10"; exit 1; }
          [ ${#ISSUER_ID} -eq 36 ] || { echo "::error::ASC_ISSUER_ID is ${#ISSUER_ID} chars, expected a 36-char UUID"; exit 1; }

          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          head -1 ~/private_keys/AuthKey_${KEY_ID}.p8 | grep -q "BEGIN PRIVATE KEY" || {
            echo "::error::ASC_KEY_P8 does not start with a PEM private key header"
            exit 1
          }

          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Without making this the default keychain, xcodebuild's automatic
          # signing cannot see the identity we just imported and quietly mints a
          # BRAND NEW "Apple Development" certificate on every run, which
          # exhausts the account-wide certificate quota within a few builds and
          # then breaks archiving for every app on the account.
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Development" || {
            echo "::error::imported certificate is not usable for code signing"
            exit 1
          }

      - name: Resolve Swift packages
        # Résolu à part, avec son propre chrono. Une résolution qui se bloque
        # *dans* `xcodebuild archive` n'a aucun timeout à elle : le 2026-09-14,
        # trois dépôts sont restés figés juste après « Checking out 5.5.1 of
        # package OneSignal-XCFramework » et GitHub ne les a tués qu'au bout de
        # SIX heures. Ici, ça échoue en 10 minutes et ça se voit.
        timeout-minutes: 10
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SereneDriving.xcodeproj \
            -scheme SereneDriving

      - name: Archive
        run: |
          # Numéro de build : minutes écoulées depuis le 2023-11-14. Strictement
          # croissant (~525 000/an) et identique à celui qu'utilise un upload manuel
          # depuis le Mac, donc les deux chemins ne se croiseront jamais.
          # `github.run_number` ne tenait pas cette promesse : il repart de son propre
          # compteur et se fait dépasser par le premier upload manuel, après quoi la CI
          # ne peut plus rien publier.
          BUILD_NUMBER=$(( ($(date +%s) - 1700000000) / 60 ))
          xcodebuild archive \
            -project SereneDriving.xcodeproj \
            -scheme SereneDriving \
            -disableAutomaticPackageResolution \
            -configuration Release \
            -archivePath build/SereneDriving.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SereneDriving.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
