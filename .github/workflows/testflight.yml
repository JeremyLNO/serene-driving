name: TestFlight Release

# Every push to main archives Serene Driving and uploads it to TestFlight.
# Repo secrets required (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              — App Store Connect API Key ID
#   ASC_ISSUER_ID           — App Store Connect API Issuer ID
#   ASC_KEY_P8              — contents of AuthKey_<id>.p8
#   IOS_DEV_CERT_P12        — base64 of the CI development certificate
#   IOS_DEV_CERT_PASSWORD   — password for that .p12
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        # App Store Connect rejects uploads built against an SDK older than the
        # current-year iOS SDK, and the runner's *default* Xcode lags behind
        # what's installed side by side on the image.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # A stray newline in either identifier makes Apple answer 401 on
          # listTeams, which surfaces as an unhelpful "Communication with Apple
          # failed". Strip whitespace and check the shapes before we build.
          KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')
          echo "key id: ${#KEY_ID} chars (expect 10), issuer: ${#ISSUER_ID} chars (expect 36)"
          [ ${#KEY_ID} -eq 10 ] || { echo "::error::ASC_KEY_ID is ${#KEY_ID} chars, expected 10"; exit 1; }
          [ ${#ISSUER_ID} -eq 36 ] || { echo "::error::ASC_ISSUER_ID is ${#ISSUER_ID} chars, expected a 36-char UUID"; exit 1; }

          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          head -1 ~/private_keys/AuthKey_${KEY_ID}.p8 | grep -q "BEGIN PRIVATE KEY" || {
            echo "::error::ASC_KEY_P8 does not start with a PEM private key header"
            exit 1
          }

          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Without making this the default keychain, xcodebuild's automatic
          # signing cannot see the identity we just imported and quietly mints a
          # BRAND NEW "Apple Development" certificate on every run, which
          # exhausts the account-wide certificate quota within a few builds and
          # then breaks archiving for every app on the account.
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Development" || {
            echo "::error::imported certificate is not usable for code signing"
            exit 1
          }

      - name: Archive
        run: |
          xcodebuild archive \
            -project SereneDriving.xcodeproj \
            -scheme SereneDriving \
            -configuration Release \
            -archivePath build/SereneDriving.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SereneDriving.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
